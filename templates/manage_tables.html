<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaları Yönet - MC Stone Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .qr-container {
            margin: 10px 0;
        }
        .table-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .table-card:hover {
            transform: translateY(-5px);
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            margin: 10px 0;
        }
        .quantity-control {
            display: flex;
            align-items: center;
        }
        .quantity {
            margin: 0 10px;
            font-weight: bold;
        }
        .total-price {
            text-align: right;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-delete {
            background-color: #ff6347;
            color: white;
            width: 100%;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">MC Stone Coffee</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manage_menu">Menüyü Yönet</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/manage_tables">Masaları Yönet</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">Masaları Yönet</h1>

        <div class="table-grid">
            {% for table in tables %}
            <div class="card table-card">
                <div class="card-body">
                    <h5 class="card-title">Masa {{ table.table_number }}</h5>
                    <p class="card-text">Aktif Sipariş: {{ table.active_orders }}</p>
                    
                    <div class="qr-container">
                        <img src="/generate_qr/{{ table.table_number }}" alt="QR Kod - Masa {{ table.table_number }}" class="img-fluid">
                    </div>
                    
                    <div class="d-flex justify-content-between mt-3">
                        <a href="#" class="btn btn-primary" onclick="downloadQR({{ table.table_number }})">QR Kodu İndir</a>
                        <a href="/view_orders/{{ table.table_number }}" class="btn btn-info">Siparişleri Gör</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function downloadQR(tableNumber) {
            fetch(`/generate_qr/${tableNumber}`)
                .then(response => response.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `masa_${tableNumber}_qr.svg`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                });
        }
    </script>
</body>
</html>
